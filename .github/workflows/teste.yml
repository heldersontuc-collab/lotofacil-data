name: Validar Lotofácil CSV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes sem rede
        run: python -m unittest discover -s tests -v
      - name: Validar integridade e continuidade da base
        run: python scripts/update_lotofacil_csv.py --validate-only
